<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="FoodExpress Deutschland – Fahrer Dashboard"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>FoodExpress Fahrer V15 Premium</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- FoodExpress CSS -->
  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- FoodExpress App -->
  <div id="app"></div>

  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <!-- FoodExpress JavaScript -->
  <script
    src="./script.js"
  ></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => {
            console.log("FoodExpress Service Worker aktiv");
          })
          .catch(error => {
            console.error(
              "Service Worker Fehler:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
